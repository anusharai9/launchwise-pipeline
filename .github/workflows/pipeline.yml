name: Launchwise URA Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python pipeline.py
      - run: |
          git config user.name "Launchwise Bot"
          git config user.email "bot@launchwise.sg"
          git add output/
          git diff --staged --quiet || git commit -m "Daily update"
          git push
